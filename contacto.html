<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://kit.fontawesome.com/a2e0e6ad5c.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <video autoplay muted loop id="bg-video">
    <source src="img/video.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

    <header>
    <h1>Venta de Motos</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="nosotros.html">Sobre Nosotros</a>
    <a href="contacto.html">Contacto</a>
  </nav>

  <main class="contact-container">
    <div class="contact-box">
      <h2>Escríbenos</h2>
      <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required></textarea>

        <button type="submit" class="btn-comprar">Enviar</button>
      </form>

      <div class="social-icons">
        <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://twitter.com/" target="_blank"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </main>

   <footer>
    <p>&copy; 2025 Venta de Motos - Todos los derechos reservados</p>
  </footer>
</body>
</html>
